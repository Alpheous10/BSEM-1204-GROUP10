<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>UniLink — Post Detail</title>
<link rel="stylesheet" href="styles.css" />
<script src="js/api.js" defer></script>
<script src="js/app.js" defer></script>
<script src="nav.js" defer></script>
<style>
.post-container { max-width: 800px; margin: 0 auto; }
.post-card-large { background: #fff; border-radius: var(--radius-lg); padding: 24px; border: 1px solid var(--gray-200); margin-bottom: 24px; }
.post-title { font-family: var(--font-display); font-size: 24px; font-weight: 800; color: var(--gray-900); margin-bottom: 12px; }
.post-author-row { display: flex; align-items: center; gap: 12px; margin-bottom: 20px; padding-bottom: 20px; border-bottom: 1px solid var(--gray-100); }
.post-content-full { font-size: 15px; line-height: 1.8; color: var(--gray-700); margin-bottom: 24px; white-space: pre-wrap; }

.comments-section { margin-top: 32px; }
.comment-item { display: flex; gap: 12px; padding: 16px 0; border-bottom: 1px solid var(--gray-100); }
.comment-body { flex: 1; }
.comment-author { font-weight: 700; font-size: 14px; color: var(--gray-900); margin-bottom: 4px; }
.comment-text { font-size: 14px; color: var(--gray-700); line-height: 1.6; }
.comment-meta { font-size: 12px; color: var(--gray-400); margin-top: 6px; }

.comment-form { background: #fff; border-radius: var(--radius-lg); padding: 20px; border: 1px solid var(--gray-200); margin-top: 24px; }
.comment-input { width: 100%; border: 1.5px solid var(--gray-200); border-radius: var(--radius); padding: 12px; font-family: inherit; font-size: 14px; resize: vertical; min-height: 80px; outline: none; margin-bottom: 12px; }
.comment-input:focus { border-color: var(--primary); }
</style>
</head>
<body>
<div class="app-shell">
  <div id="sidebar-mount" data-active="dashboard"></div>

  <main class="main">
    <header class="topbar">
      <a href="dashboard.html" style="display:flex;align-items:center;gap:6px;text-decoration:none;color:var(--gray-500);font-size:13px;font-weight:500;">
        <svg width="16" height="16" fill="none" viewBox="0 0 24 24" stroke="currentColor" stroke-width="2"><path d="M15.75 19.5L8.25 12l7.5-7.5"/></svg>
        Back to Feed
      </a>
      <div class="topbar-actions" style="margin-left:auto;">
        <div class="topbar-avatar" id="top-avatar">?</div>
      </div>
    </header>

    <div class="page-content">
      <div class="post-container" id="post-detail-mount">
        <p style="text-align: center; padding: 40px; color: var(--gray-500);">Loading post...</p>
      </div>
    </div>
  </main>
</div>

<script>
async function loadPostDetail() {
  const urlParams = new URLSearchParams(window.location.search);
  const postId = urlParams.get('id');
  if (!postId) {
    window.location.href = 'dashboard.html';
    return;
  }

  try {
    const post = await api.posts.get(postId);
    const comments = await api.comments.getByPost(postId);
    renderPostDetail(post, comments);
  } catch (err) {
    document.getElementById('post-detail-mount').innerHTML = `
      <div class="card" style="padding: 40px; text-align: center;">
        <h3 style="color: var(--danger);">Error</h3>
        <p>${err.message}</p>
        <a href="dashboard.html" class="btn btn-primary" style="margin-top: 20px;">Return to Dashboard</a>
      </div>
    `;
  }
}

function renderPostDetail(post, comments) {
  const mount = document.getElementById('post-detail-mount');
  const authorName = post.author ? post.author.username : `User ${post.user_id}`;
  const initials = authorName[0].toUpperCase();
  const timeAgo = formatTimeAgo(post.created_at);

  mount.innerHTML = `
    <div class="post-card-large">
      <h1 class="post-title">${esc(post.title)}</h1>
      <div class="post-author-row">
        <div class="disc-avatar" style="width: 42px; height: 42px;">${initials}</div>
        <div>
          <div class="comment-author">${esc(authorName)}</div>
          <div class="disc-meta">${timeAgo}</div>
        </div>
      </div>
      <div class="post-content-full">${esc(post.content)}</div>
      <div class="disc-reactions">
        <button class="btn btn-ghost btn-sm" onclick="handleLike(${post.id})">
          <svg width="16" height="16" fill="none" viewBox="0 0 24 24" stroke="currentColor" stroke-width="2"><path d="M6.633 10.5c.806 0 1.533-.446 2.031-1.08a9.041 9.041 0 012.861-2.4c.723-.384 1.35-.956 1.653-1.715a4.498 4.498 0 00.322-1.672V3a.75.75 0 01.75-.75A2.25 2.25 0 0116.5 4.5c0 1.152-.26 2.243-.723 3.218-.266.558.107 1.282.725 1.282h3.126c1.026 0 1.945.694 2.054 1.715.045.422.068.85.068 1.285a11.95 11.95 0 01-2.649 7.521c-.388.482-.987.729-1.605.729H13.48c-.483 0-.964-.078-1.423-.23l-3.114-1.04a4.501 4.501 0 00-1.423-.23H5.253m0 0H3.75"/></svg>
          ${post.like_count || 0} Likes
        </button>
      </div>
    </div>

    <div class="comments-section">
      <h3 style="font-family: var(--font-display); font-size: 18px; margin-bottom: 20px;">Comments (${comments.length})</h3>
      <div id="comments-list">
        ${comments.map(c => `
          <div class="comment-item">
            <div class="disc-avatar" style="width: 32px; height: 32px; font-size: 11px;">${(c.author ? c.author.username : 'U')[0].toUpperCase()}</div>
            <div class="comment-body">
              <div class="comment-author">${esc(c.author ? c.author.username : 'User ' + c.user_id)}</div>
              <div class="comment-text">${esc(c.content)}</div>
              <div class="comment-meta">${formatTimeAgo(c.created_at)}</div>
            </div>
          </div>
        `).join('')}
        ${comments.length === 0 ? '<p style="color: var(--gray-400); font-size: 14px;">No comments yet. Be the first to reply!</p>' : ''}
      </div>

      <div class="comment-form">
        <textarea id="comment-input" class="comment-input" placeholder="Write a reply..."></textarea>
        <div style="display: flex; justify-content: flex-end;">
          <button class="btn btn-primary" onclick="submitComment(${post.id})">Post Reply</button>
        </div>
      </div>
    </div>
  `;
}

async function submitComment(postId) {
  const input = document.getElementById('comment-input');
  const content = input.value.trim();
  if (!content) return;

  try {
    await api.comments.create(content, postId);
    location.reload();
  } catch (err) {
    alert(err.message);
  }
}

async function handleLike(postId) {
  try {
    await api.likes.like(postId);
    location.reload();
  } catch (err) {
    // If already liked, maybe unlike? The api.js has both.
    try {
      await api.likes.unlike(postId);
      location.reload();
    } catch (err2) {
      alert(err2.message);
    }
  }
}

// Ensure loadPostDetail runs after initApp
window.addEventListener('DOMContentLoaded', () => {
  // Wait a bit for initApp (which runs on DOMContentLoaded too) to finish
  setTimeout(loadPostDetail, 100);
});
</script>
</body>
</html>
