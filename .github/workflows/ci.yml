name: UniHub CI

on:
  pull_request:
    branches: [main, develop]
  push:
    branches: [develop]

jobs:
  lint-and-test:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          pip install flake8 black pytest pytest-cov httpx

      - name: Lint with flake8
        run: |
          flake8 app/ --max-line-length=100 --exclude=__pycache__

      - name: Check formatting with black
        run: |
          black --check app/

      - name: Run tests
        env:
          DATABASE_URL: sqlite:///./test.db
          SECRET_KEY: ci-test-secret-key-not-real
          ALGORITHM: HS256
          ACCESS_TOKEN_EXPIRE_MINUTES: 30
        run: |
          pytest tests/ --cov=app --cov-report=term-missing

      - name: Enforce minimum test coverage
        run: pytest tests/ --cov=app --cov-fail-under=60
