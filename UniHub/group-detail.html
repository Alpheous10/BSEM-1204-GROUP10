<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Project Group | UniHub</title>
  <link rel="stylesheet" href="styles.css">
  <link rel="icon" type="image/png" href="logo/unihub.png">
  <script src="https://unpkg.com/lucide@latest"></script>
  <script src="js/config.js" defer></script>
  <script src="js/api.js" defer></script>
  <script src="nav.js" defer></script>
  <script src="js/app.js" defer></script>
  <style>
    .group-detail-header {
      background: var(--color-surface);
      border: 1px solid var(--color-border);
      border-radius: var(--radius-lg);
      padding: var(--space-8);
      margin-bottom: var(--space-8);
      display: flex;
      gap: var(--space-8);
      align-items: center;
      box-shadow: var(--shadow-sm);
    }
    .group-avatar-xl {
      width: 100px; height: 100px; border-radius: var(--radius-lg);
      background: var(--color-primary-50);
      display: flex; align-items: center; justify-content: center;
      font-size: 48px; flex-shrink: 0;
      box-shadow: var(--shadow-sm);
    }
    .group-info-main { flex: 1; }
    .group-info-main h1 { font-size: var(--text-2xl); font-weight: var(--font-bold); margin-bottom: var(--space-2); }
    .group-info-main p { color: var(--color-text-muted); font-size: var(--text-base); line-height: var(--leading-normal); max-width: 800px; }
    
    .group-content-grid {
      display: grid;
      grid-template-columns: 1fr 300px;
      gap: var(--space-8);
    }

    .task-card {
      padding: var(--space-4);
      border-radius: var(--radius-md);
      border: 1px solid var(--color-border);
      margin-bottom: var(--space-3);
      display: flex;
      gap: var(--space-3);
      align-items: flex-start;
      transition: all 0.2s ease;
    }
    .task-card:hover {
      border-color: var(--color-primary-400);
      box-shadow: var(--shadow-sm);
    }
    .task-status-badge {
      width: 24px; height: 24px; border-radius: 50%;
      flex-shrink: 0;
      display: flex; align-items: center; justify-content: center;
    }
    .task-status-open { background: var(--color-danger-100); color: var(--color-danger-600); }
    .task-status-progress { background: var(--color-warning-100); color: var(--color-warning-600); }
    .task-status-done { background: var(--color-success-100); color: var(--color-success-600); }

    @media (max-width: 1024px) {
      .group-detail-header { flex-direction: column; text-align: center; gap: var(--space-4); }
      .group-content-grid { grid-template-columns: 1fr; }
    }
  </style>
</head>
<body>
  <div id="nav-mount"></div>

  <div class="app-shell">
    <main class="main">
      <div class="page-content">
        <div id="group-header-mount">
          <div class="group-detail-header skeleton" style="height: 180px;"></div>
        </div>

        <div class="tabs mb-8" id="group-tabs">
          <button class="tab-btn active" onclick="switchGroupTab('overview', this)">Overview</button>
          <button class="tab-btn" onclick="switchGroupTab('tasks', this)">Tasks</button>
          <button class="tab-btn" onclick="switchGroupTab('members', this)">Members</button>
          <button class="tab-btn" onclick="switchGroupTab('milestones', this)">Milestones</button>
        </div>

        <div class="group-content-grid">
          <div id="group-tab-content">
            <div class="flex-between mb-4">
              <h2 style="font-size: var(--text-lg); font-weight: var(--font-bold);">Overview</h2>
            </div>
            <div id="overview-content">
              <div class="card skeleton mb-4" style="height: 160px;"></div>
            </div>
          </div>

          <aside class="group-sidebar">
            <div class="card mb-6">
              <h3 class="rail-section h3" style="font-size: var(--text-xs); font-weight: var(--font-bold); text-transform: uppercase; color: var(--color-text-subtle); margin-bottom: var(--space-4);">About Group</h3>
              <div id="group-stats-side">
                <div class="flex-between mb-2">
                  <span style="font-size: var(--text-sm); color: var(--color-text-muted);">Members</span>
                  <span style="font-weight: var(--font-bold);" id="side-group-member-count">0</span>
                </div>
                <div class="flex-between mb-2">
                  <span style="font-size: var(--text-sm); color: var(--color-text-muted);">Created</span>
                  <span style="font-weight: var(--font-bold);" id="side-group-created-date">-</span>
                </div>
                <div class="flex-between">
                  <span style="font-size: var(--text-sm); color: var(--color-text-muted);">Community</span>
                  <span style="font-weight: var(--font-bold);" id="side-community-name">-</span>
                </div>
              </div>
            </div>
            
            <div class="card">
              <h3 class="rail-section h3" style="font-size: var(--text-xs); font-weight: var(--font-bold); text-transform: uppercase; color: var(--color-text-subtle); margin-bottom: var(--space-4);">Quick Links</h3>
              <div id="quick-links">
                <div class="mb-2">
                  <button class="btn btn-outline btn-sm w-full" onclick="openCreatePostModal()">
                    <i data-lucide="message-square" style="width:14px; height:14px; margin-right: var(--space-1);"></i> New Post
                  </button>
                </div>
                <div class="mb-2">
                  <button class="btn btn-outline btn-sm w-full" onclick="openCreateTaskModal()">
                    <i data-lucide="check-square" style="width:14px; height:14px; margin-right: var(--space-1);"></i> New Task
                  </button>
                </div>
              </div>
            </div>
          </aside>
        </div>
      </div>
    </main>
  </div>

  <!-- Create Task Modal -->
  <div id="create-task-modal" class="modal-overlay">
    <div class="modal-container" style="max-width: 600px;">
      <div class="modal-header">
        <h2>Create New Task</h2>
        <button class="icon-btn" onclick="closeCreateTaskModal()">
          <i data-lucide="x"></i>
        </button>
      </div>
      <div class="modal-body">
        <div class="form-group">
          <label>Task Template</label>
          <select id="task-template" class="input" onchange="applyTaskTemplate()">
            <option value="">Blank</option>
            <option value="feature">Feature Request</option>
            <option value="bug">Bug Report</option>
            <option value="documentation">Documentation</option>
            <option value="chore">Chore/Setup</option>
          </select>
        </div>
        <div class="form-group">
          <label>Title</label>
          <input type="text" id="task-title" class="input" placeholder="e.g., Implement login functionality">
        </div>
        <div class="form-group">
          <label>Description</label>
          <textarea id="task-description" class="input" rows="6" placeholder="Describe the task in detail..."></textarea>
        </div>
        <div class="grid-2">
          <div class="form-group">
            <label>Assignee</label>
            <select id="task-assignee" class="input">
              <option value="">Unassigned</option>
            </select>
          </div>
          <div class="form-group">
            <label>Status</label>
            <select id="task-status" class="input">
              <option value="open">Open</option>
              <option value="in_progress">In Progress</option>
              <option value="done">Done</option>
            </select>
          </div>
        </div>
        <div class="form-group">
          <label>Priority</label>
          <select id="task-priority" class="input">
            <option value="low">Low</option>
            <option value="medium">Medium</option>
            <option value="high">High</option>
          </select>
        </div>
      </div>
      <div class="modal-footer">
        <button class="btn btn-outline" onclick="closeCreateTaskModal()">Cancel</button>
        <button class="btn btn-primary" onclick="handleCreateTask()">Create Task</button>
      </div>
    </div>
  </div>

  <script>
    let groupId = new URLSearchParams(window.location.search).get('id');
    let currentGroup = null;
    let activeGroupTab = 'overview';
    let groupTasks = [
      { id: 1, title: 'Set up project repository', description: 'Create Git repo and add initial files', status: 'done', priority: 'high', assignee: 'john_doe' },
      { id: 2, title: 'Write project proposal', description: 'Draft the project proposal document', status: 'in_progress', priority: 'high', assignee: 'jane_smith' },
      { id: 3, title: 'Design UI mockups', description: 'Create wireframes for main screens', status: 'open', priority: 'medium', assignee: '' },
      { id: 4, title: 'Implement backend API', description: 'Build REST API endpoints', status: 'open', priority: 'high', assignee: '' }
    ];

    async function loadGroupDetail() {
      try {
        currentGroup = await api.projectGroups.get(groupId);
        const myGroupIds = (await api.projectGroups.getMy()).map(g => g.id);
        const isJoined = myGroupIds.includes(parseInt(groupId));
        const groupMembers = await api.projectGroups.getMembers(groupId);

        document.getElementById('group-header-mount').innerHTML = `
          <div class="group-detail-header">
            <div class="group-avatar-xl"><i data-lucide="users"></i></div>
            <div class="group-info-main">
              <h1>${esc(currentGroup.name)}</h1>
              <p>${esc(currentGroup.description || 'A collaborative project group.')}</p>
            </div>
            <div class="group-actions">
              ${isJoined ? 
                `<button class="btn btn-outline" onclick="handleLeaveGroup()">Leave Group</button>` :
                `<button class="btn btn-primary" onclick="handleJoinGroup()">Join Group</button>`
              }
            </div>
          </div>
        `;

        document.getElementById('side-group-member-count').textContent = currentGroup.member_count || 0;
        document.getElementById('side-group-created-date').textContent = new Date(currentGroup.created_at).toLocaleDateString();
        document.getElementById('side-community-name').textContent = currentGroup.community_name || 'General';

        // Populate task assignee dropdown
        const assigneeSelect = document.getElementById('task-assignee');
        assigneeSelect.innerHTML = '<option value="">Unassigned</option>';
        groupMembers.forEach(member => {
          assigneeSelect.innerHTML += `<option value="${member.username}">${member.username}</option>`;
        });

        loadGroupTabContent();
        initIcons();
      } catch (err) {
        console.error(err);
      }
    }

    async function loadGroupTabContent() {
      const container = document.getElementById('group-tab-content');
      
      if (activeGroupTab === 'overview') {
        container.innerHTML = `
          <div class="flex-between mb-6">
            <h2 style="font-size: var(--text-xl); font-weight: var(--font-bold);">Overview</h2>
          </div>
          <div id="group-posts-list"></div>
        `;
        const posts = await api.posts.getAll(0, 50, null, groupId);
        const list = document.getElementById('group-posts-list');
        if (posts.length === 0) {
          list.innerHTML = `
            <div class="card empty-state">
              <i data-lucide="message-square"></i>
              <h3>No posts yet</h3>
              <p>Be the first to share something with the group!</p>
              <button class="btn btn-primary mt-4" onclick="openCreatePostModal()">Create First Post</button>
            </div>`;
        } else {
          list.innerHTML = posts.map(p => renderDiscussionCard(p)).join('');
        }
      } else if (activeGroupTab === 'tasks') {
        container.innerHTML = `
          <div class="flex-between mb-6">
            <h2 style="font-size: var(--text-xl); font-weight: var(--font-bold);">Tasks</h2>
            <button class="btn btn-primary" onclick="openCreateTaskModal()">
              <i data-lucide="plus"></i> New Task
            </button>
          </div>
          <div id="tasks-list"></div>
        `;
        renderTasks();
      } else if (activeGroupTab === 'members') {
        container.innerHTML = `
          <div class="flex-between mb-6">
            <h2 style="font-size: var(--text-xl); font-weight: var(--font-bold);">Members</h2>
          </div>
          <div id="members-list"></div>
        `;
        const members = await api.projectGroups.getMembers(groupId);
        const membersList = document.getElementById('members-list');
        if (members.length === 0) {
          membersList.innerHTML = `
            <div class="card empty-state">
              <i data-lucide="users"></i>
              <h3>No members yet</h3>
              <p>Invite people to join this project group!</p>
            </div>`;
        } else {
          membersList.innerHTML = members.map(m => renderMemberCard(m)).join('');
        }
      } else if (activeGroupTab === 'milestones') {
        container.innerHTML = `
          <div class="flex-between mb-6">
            <h2 style="font-size: var(--text-xl); font-weight: var(--font-bold);">Milestones</h2>
          </div>
          <div id="milestones-list">
            <div class="card empty-state">
              <i data-lucide="flag"></i>
              <h3>No milestones yet</h3>
              <p>Set goals and track your project progress!</p>
            </div>
          </div>
        `;
      }
      initIcons();
    }

    function renderMemberCard(member) {
      const roles = ['Admin', 'Maintainer', 'Writer', 'Reader'];
      const role = roles[Math.floor(Math.random() * roles.length)];
      return `
        <div class="card mb-3" style="display: flex; align-items: center; gap: var(--space-4);">
          <div style="width: 48px; height: 48px; border-radius: 50%; background: var(--color-primary-100); display: flex; align-items: center; justify-content: center; font-size: var(--text-lg); font-weight: var(--font-bold); color: var(--color-primary-700);">
            ${member.username[0].toUpperCase()}
          </div>
          <div style="flex: 1;">
            <div style="display: flex; align-items: center; gap: var(--space-2);">
              <h3 style="font-weight: var(--font-bold);">${esc(member.username)}</h3>
              <span class="tag tag-${role === 'Admin' ? 'red' : role === 'Maintainer' ? 'blue' : role === 'Writer' ? 'green' : 'gray'}" style="font-size: 10px;">${role}</span>
            </div>
            <p style="font-size: var(--text-sm); color: var(--color-text-muted);">Joined ${new Date(member.joined_at || Date.now()).toLocaleDateString()}</p>
          </div>
        </div>
      `;
    }

    function renderTasks() {
      const container = document.getElementById('tasks-list');
      if (groupTasks.length === 0) {
        container.innerHTML = `
          <div class="card empty-state">
            <i data-lucide="check-square"></i>
            <h3>No tasks yet</h3>
            <p>Create your first task to get started!</p>
            <button class="btn btn-primary mt-4" onclick="openCreateTaskModal()">Create First Task</button>
          </div>`;
      } else {
        container.innerHTML = groupTasks.map(task => renderTaskCard(task)).join('');
      }
      initIcons();
    }

    function renderTaskCard(task) {
      const statusColors = {
        open: { bg: 'var(--color-danger-100)', text: 'var(--color-danger-700)', icon: 'circle' },
        in_progress: { bg: 'var(--color-warning-100)', text: 'var(--color-warning-700)', icon: 'play-circle' },
        done: { bg: 'var(--color-success-100)', text: 'var(--color-success-700)', icon: 'check-circle' }
      };
      const status = statusColors[task.status] || statusColors.open;
      return `
        <div class="task-card">
          <div class="task-status-badge" style="background: ${status.bg}; color: ${status.text};">
            <i data-lucide="${status.icon}" style="width:14px; height:14px;"></i>
          </div>
          <div style="flex:1;">
            <div style="display: flex; align-items: center; gap: var(--space-2); margin-bottom: var(--space-1);">
              <h4 style="font-weight: var(--font-bold);">${esc(task.title)}</h4>
              <span class="tag tag-${task.priority === 'high' ? 'red' : task.priority === 'medium' ? 'yellow' : 'green'}" style="font-size: 10px;">${task.priority}</span>
            </div>
            <p style="font-size: var(--text-sm); color: var(--color-text-muted); margin-bottom: var(--space-2);">${esc(task.description)}</p>
            <div style="display: flex; align-items: center; gap: var(--space-3); font-size: var(--text-xs); color: var(--color-text-muted);">
              <span><i data-lucide="user" style="width:12px; height:12px;"></i> ${task.assignee || 'Unassigned'}</span>
            </div>
          </div>
        </div>
      `;
    }

    function switchGroupTab(tab, btn) {
      activeGroupTab = tab;
      document.querySelectorAll('#group-tabs .tab-btn').forEach(b => b.classList.remove('active'));
      btn.classList.add('active');
      loadGroupTabContent();
    }

    async function handleJoinGroup() {
      try { await api.projectGroups.join(groupId); loadGroupDetail(); } catch (err) { alert(err.message); }
    }
    async function handleLeaveGroup() {
      try { await api.projectGroups.leave(groupId); loadGroupDetail(); } catch (err) { alert(err.message); }
    }

    function openCreateTaskModal() {
      document.getElementById('create-task-modal').classList.add('open');
    }
    function closeCreateTaskModal() {
      document.getElementById('create-task-modal').classList.remove('open');
      document.getElementById('task-title').value = '';
      document.getElementById('task-description').value = '';
      document.getElementById('task-assignee').value = '';
      document.getElementById('task-status').value = 'open';
      document.getElementById('task-priority').value = 'medium';
    }
    function applyTaskTemplate() {
      const template = document.getElementById('task-template').value;
      const descEl = document.getElementById('task-description');
      const templates = {
        feature: `## Description
Briefly describe the feature you want to add.

## Acceptance Criteria
- [ ] Criteria 1
- [ ] Criteria 2
- [ ] Criteria 3

## Additional Notes
Any other relevant information.`,
        bug: `## Description
Describe the bug clearly.

## Steps to Reproduce
1. Step 1
2. Step 2
3. Step 3

## Expected Behavior
What should happen?

## Actual Behavior
What actually happens?

## Environment
- Browser:
- OS:`,
        documentation: `## What needs to be documented?
Describe what documentation is missing or needs updating.

## Checklist
- [ ] Update README
- [ ] Add code comments
- [ ] Create user guide`,
        chore: `## Description
Describe the setup or maintenance task.

## Checklist
- [ ] Task 1
- [ ] Task 2
- [ ] Task 3`
      };
      descEl.value = templates[template] || '';
    }

    function handleCreateTask() {
      const title = document.getElementById('task-title').value.trim();
      const description = document.getElementById('task-description').value.trim();
      const assignee = document.getElementById('task-assignee').value;
      const status = document.getElementById('task-status').value;
      const priority = document.getElementById('task-priority').value;
      if (!title) {
        alert('Please enter a task title');
        return;
      }
      groupTasks.unshift({
        id: groupTasks.length + 1,
        title,
        description,
        assignee,
        status,
        priority
      });
      closeCreateTaskModal();
      renderTasks();
    }

    document.addEventListener('DOMContentLoaded', async () => {
      const user = JSON.parse(localStorage.getItem('currentUser'));
      document.getElementById('nav-mount').outerHTML = renderNav('project-groups', user);
      initIcons();
      loadGroupDetail();
    });
  </script>
</body>
</html>
