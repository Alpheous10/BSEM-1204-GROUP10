<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Communities | UniHub</title>
  <link rel="stylesheet" href="styles.css">
  <link rel="icon" type="image/png" href="logo/unihub.png">
  <script src="https://unpkg.com/lucide@latest"></script>
  <script src="js/api.js" defer></script>
  <script src="nav.js" defer></script>
  <script src="js/app.js" defer></script>
  <style>
    .comm-card { display: flex; flex-direction: column; height: 100%; }
    .comm-banner { height: 80px; background: var(--color-primary-600); border-radius: var(--radius-lg) var(--radius-lg) 0 0; margin: -var(--space-5) -var(--space-5) var(--space-4) -var(--space-5); }
    .comm-icon { width: 48px; height: 48px; border-radius: 12px; display: flex; align-items: center; justify-content: center; font-size: 24px; margin-top: -32px; border: 4px solid var(--color-surface); background: var(--color-surface-2); margin-bottom: var(--space-2); }
    .comm-name { font-size: var(--text-lg); font-weight: var(--font-bold); margin-bottom: var(--space-1); }
    .comm-desc { font-size: var(--text-sm); color: var(--color-text-muted); line-height: var(--leading-normal); flex: 1; margin-bottom: var(--space-4); }
    .comm-footer { display: flex; align-items: center; justify-content: space-between; padding-top: var(--space-4); border-top: 1px solid var(--color-border); }
    .comm-stats { display: flex; align-items: center; gap: var(--space-3); font-size: var(--text-xs); color: var(--color-text-muted); }
  </style>
</head>
<body>
  <div id="nav-mount"></div>

  <div class="app-shell">
    <main class="main">
      <div class="page-content">
        <div class="page-header">
          <div>
            <h1>Communities</h1>
            <p>Explore academic groups or manage your own</p>
          </div>
          <button class="btn btn-primary" onclick="openCreateCommunityModal()">
            <i data-lucide="plus"></i>
            Create Community
          </button>
        </div>

        <div class="tabs mb-8">
          <button class="tab-btn active" onclick="switchCommunityTab('all', this)">All Communities</button>
          <button class="tab-btn" onclick="switchCommunityTab('mine', this)">My Communities</button>
        </div>

        <div class="grid-3" id="communities-grid">
          <!-- Skeletons -->
          <div class="card skeleton" style="height: 320px;"></div>
          <div class="card skeleton" style="height: 320px;"></div>
          <div class="card skeleton" style="height: 320px;"></div>
        </div>
      </div>
    </main>
  </div>

  <script>
    let currentTab = 'all';

    async function loadCommunities() {
      const grid = document.getElementById('communities-grid');
      try {
        const communities = currentTab === 'all' ? await api.communities.getAll() : await api.communities.getMy();
        const myCommIds = (await api.communities.getMy()).map(c => c.id);

        if (communities.length === 0) {
          grid.innerHTML = `
            <div class="card empty-state" style="grid-column: 1/-1;">
              <i data-lucide="users"></i>
              <h3>${currentTab === 'all' ? 'No communities found' : 'No joined communities'}</h3>
              <p>${currentTab === 'all' ? 'Be the first to create a community for your course!' : 'Explore all communities to find your courses.'}</p>
              ${currentTab === 'all' ? 
                '<button class="btn btn-primary" onclick="openCreateCommunityModal()">Create Community</button>' : 
                '<button class="btn btn-primary" onclick="switchCommunityTab(\'all\', document.querySelectorAll(\'.tab-btn\')[0])">Browse All</button>'
              }
            </div>`;
          initIcons();
          return;
        }

        grid.innerHTML = communities.map(c => {
          const isJoined = myCommIds.includes(c.id);
          return renderCommunityCardLarge(c, isJoined);
        }).join('');
        initIcons();
      } catch (err) {
        grid.innerHTML = `<div class="card" style="grid-column: 1/-1; color: var(--color-danger-500); padding: var(--space-8); text-align: center;">
          <i data-lucide="alert-circle" style="margin-bottom: var(--space-2);"></i>
          <p>Failed to load communities: ${err.message}</p>
          <button class="btn btn-outline btn-sm mt-4" onclick="loadCommunities()">Try Again</button>
        </div>`;
        initIcons();
      }
    }

    function renderCommunityCardLarge(c, isJoined) {
      return `
        <div class="card comm-card card-clickable" onclick="window.location.href='community-detail.html?id=${c.id}'">
          <div class="comm-banner" style="background: linear-gradient(135deg, var(--color-primary-600), var(--color-primary-300))"></div>
          <div class="comm-icon" style="background: var(--color-surface); box-shadow: var(--shadow-sm);">${c.icon || '🎓'}</div>
          <div style="flex: 1;">
            <h2 class="comm-name">${esc(c.name)}</h2>
            <p class="comm-desc">${esc(c.description || 'Join this academic community to share resources and discuss topics.')}</p>
          </div>
          <div class="comm-footer">
            <div class="comm-stats">
              <span style="display:flex; align-items:center; gap:var(--space-1);"><i data-lucide="users" style="width:14px; height:14px;"></i> ${c.member_count || 0}</span>
              <span style="display:flex; align-items:center; gap:var(--space-1);"><i data-lucide="message-square" style="width:14px; height:14px;"></i> ${c.post_count || 0}</span>
            </div>
            ${isJoined ? 
              '<span class="tag tag-blue">Joined</span>' : 
              `<button class="btn btn-primary btn-sm" onclick="event.stopPropagation(); handleJoin(${c.id}, this)">Join</button>`
            }
          </div>
        </div>
      `;
    }

    async function handleJoin(id, btn) {
      try {
        setLoading(btn, true);
        await api.communities.join(id);
        loadCommunities();
      } catch (err) {
        alert(err.message);
      } finally {
        setLoading(btn, false);
      }
    }

    function switchCommunityTab(tab, btn) {
      currentTab = tab;
      document.querySelectorAll('.tab-btn').forEach(b => b.classList.remove('active'));
      btn.classList.add('active');
      loadCommunities();
    }

    document.addEventListener('DOMContentLoaded', async () => {
      const mount = document.getElementById('nav-mount');
      const user = JSON.parse(localStorage.getItem('currentUser'));
      mount.outerHTML = renderNav('communities', user);
      initIcons();
      loadCommunities();
    });
  </script>
</body>
</html>
