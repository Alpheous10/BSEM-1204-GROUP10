<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Discussion | UniHub</title>
  <link rel="stylesheet" href="styles.css">
  <link rel="icon" type="image/png" href="logo/unihub.png">
  <script src="https://unpkg.com/lucide@latest"></script>
  <script src="js/api.js" defer></script>
  <script src="nav.js" defer></script>
  <script src="js/app.js" defer></script>
  <style>
    .post-full-card { padding: var(--space-8); margin-bottom: var(--space-8); }
    .post-full-header { display: flex; align-items: center; gap: var(--space-4); margin-bottom: var(--space-6); }
    .post-full-title { font-size: var(--text-3xl); font-weight: var(--font-bold); line-height: var(--leading-tight); margin-bottom: var(--space-6); }
    .post-full-content { font-size: var(--text-base); color: var(--color-text); line-height: var(--leading-relaxed); margin-bottom: var(--space-8); white-space: pre-wrap; }
    
    .comment-card { padding: var(--space-4); margin-bottom: var(--space-4); background: var(--color-surface-2); border: none; }
    .comment-header { display: flex; align-items: center; gap: var(--space-2); margin-bottom: var(--space-2); font-size: var(--text-xs); }
    .comment-content { font-size: var(--text-sm); line-height: var(--leading-normal); }

    .comment-input-box {
      background: var(--color-surface);
      border: 1px solid var(--color-border);
      border-radius: var(--radius-lg);
      padding: var(--space-4);
      margin-bottom: var(--space-8);
      box-shadow: var(--shadow-sm);
    }
  </style>
</head>
<body>
  <div id="nav-mount"></div>

  <div class="app-shell">
    <main class="main">
      <div class="page-content">
        <div id="post-mount">
          <!-- Skeleton -->
          <div class="card skeleton" style="height: 400px; margin-bottom: var(--space-8);"></div>
        </div>

        <section class="comments-section">
          <h2 style="font-size: var(--text-xl); font-weight: var(--font-bold); margin-bottom: var(--space-6);">Comments</h2>
          
          <div class="comment-input-box">
            <textarea class="form-control mb-4" id="comment-textarea" placeholder="Add to the discussion..."></textarea>
            <div class="flex-between">
              <span style="font-size: var(--text-xs); color: var(--color-text-subtle);">Be respectful and constructive.</span>
              <button class="btn btn-primary btn-sm" onclick="handleSubmitComment()">Post Comment</button>
            </div>
          </div>

          <div id="comments-list">
            <div class="card skeleton mb-4" style="height: 100px;"></div>
            <div class="card skeleton mb-4" style="height: 100px;"></div>
          </div>
        </section>
      </div>
    </main>
  </div>

  <script>
    const postId = new URLSearchParams(window.location.search).get('id');
    let currentPost = null;

    async function loadPostDetail() {
      try {
        currentPost = await api.posts.get(postId);
        const authorName = currentPost.author ? (currentPost.author.full_name || currentPost.author.username) : 'Anonymous';
        const initials = authorName[0].toUpperCase();

        document.getElementById('post-mount').innerHTML = `
          <article class="card post-full-card">
            <div class="post-full-header">
              <div class="topbar-avatar" style="width:48px; height:48px; font-size:18px;">${initials}</div>
              <div>
                <div style="font-weight:var(--font-bold);">${esc(authorName)}</div>
                <div style="font-size:var(--text-xs); color:var(--color-text-muted);">
                  ${formatTimeAgo(currentPost.created_at)} in 
                  <a href="community-detail.html?id=${currentPost.community_id}" class="tag tag-blue" style="margin-left:4px;">${esc(currentPost.community_name)}</a>
                </div>
              </div>
            </div>
            <h1 class="post-full-title">${esc(currentPost.title)}</h1>
            <div class="post-full-content">${esc(currentPost.content)}</div>
            
            <div class="flex-between" style="padding-top:var(--space-6); border-top:1px solid var(--color-border);">
              <div style="display:flex; gap:var(--space-8);">
                <button class="btn btn-ghost" onclick="handleLike()">
                  <i data-lucide="heart" style="width:20px; height:20px;"></i>
                  <span>${currentPost.like_count || 0} Likes</span>
                </button>
                <button class="btn btn-ghost">
                  <i data-lucide="message-square" style="width:20px; height:20px;"></i>
                  <span>${currentPost.comment_count || 0} Comments</span>
                </button>
              </div>
              <button class="btn btn-outline">
                <i data-lucide="share-2"></i> Share
              </button>
            </div>
          </article>
        `;

        loadComments();
        initIcons();
      } catch (err) {
        document.getElementById('post-mount').innerHTML = `<div class="card empty-state"><h3>Post not found</h3><p>${err.message}</p></div>`;
      }
    }

    async function loadComments() {
      const list = document.getElementById('comments-list');
      try {
        const comments = await api.comments.getByPost(postId);
        if (comments.length === 0) {
          list.innerHTML = `<p class="empty-state" style="padding:var(--space-8);">No comments yet. Start the conversation!</p>`;
        } else {
          list.innerHTML = comments.map(c => renderComment(c)).join('');
        }
        initIcons();
      } catch (err) {
        list.innerHTML = `<p style="color:var(--color-danger-500);">Failed to load comments.</p>`;
      }
    }

    function renderComment(c) {
      const authorName = c.author ? (c.author.full_name || c.author.username) : 'Anonymous';
      const initials = authorName[0].toUpperCase();
      return `
        <div class="card comment-card">
          <div class="comment-header">
            <div class="topbar-avatar" style="width:20px; height:20px; font-size:8px;">${initials}</div>
            <span style="font-weight:var(--font-bold); color:var(--color-text);">${esc(authorName)}</span>
            <span style="color:var(--color-text-subtle);">•</span>
            <span style="color:var(--color-text-subtle);">${formatTimeAgo(c.created_at)}</span>
          </div>
          <div class="comment-content">${esc(c.content)}</div>
        </div>
      `;
    }

    async function handleSubmitComment() {
      const text = document.getElementById('comment-textarea').value;
      if (!text.trim()) return;
      try {
        await api.comments.create(text, postId);
        document.getElementById('comment-textarea').value = '';
        loadComments();
        loadPostDetail(); // Refresh comment count
      } catch (err) {
        alert(err.message);
      }
    }

    document.addEventListener('DOMContentLoaded', async () => {
      const user = JSON.parse(localStorage.getItem('currentUser'));
      document.getElementById('nav-mount').outerHTML = renderNav('communities', user);
      initIcons();
      loadPostDetail();
    });
  </script>
</body>
</html>
