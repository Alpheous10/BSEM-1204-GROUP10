<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Notifications | UniHub</title>
  <link rel="stylesheet" href="styles.css">
  <link rel="icon" type="image/png" href="logo/unihub.png">
  <script src="https://unpkg.com/lucide@latest"></script>
  <script src="js/config.js" defer></script>
  <script src="js/api.js" defer></script>
  <script src="nav.js" defer></script>
  <script src="js/app.js" defer></script>
  <style>
    .notif-card { display: flex; gap: var(--space-4); padding: var(--space-5); margin-bottom: var(--space-2); border-left: 4px solid transparent; transition: all 150ms ease; }
    .notif-card.unread { background: var(--color-primary-50); border-left-color: var(--color-primary-500); }
    .notif-icon-box { width: 40px; height: 40px; border-radius: 50%; display: flex; align-items: center; justify-content: center; flex-shrink: 0; }
    .notif-icon-like { background: var(--color-danger-100); color: var(--color-danger-500); }
    .notif-icon-comment { background: var(--color-info-100); color: var(--color-info-500); }
    .notif-icon-community { background: var(--color-success-100); color: var(--color-success-500); }
    .notif-content { flex: 1; }
    .notif-text { font-size: var(--text-sm); line-height: var(--leading-normal); margin-bottom: 2px; }
    .notif-time { font-size: 11px; color: var(--color-text-subtle); }
  </style>
</head>
<body>
  <div id="nav-mount"></div>

  <div class="app-shell">
    <main class="main">
      <div class="page-content">
        <div class="page-header">
          <div>
            <h1>Notifications</h1>
            <p>Stay updated with your academic activity</p>
          </div>
          <button class="btn btn-outline btn-sm" onclick="handleMarkAllRead()">
            <i data-lucide="check-check"></i> Mark all as read
          </button>
        </div>

        <div id="notifications-list">
          <!-- Skeletons -->
          <div class="card skeleton mb-2" style="height: 80px;"></div>
          <div class="card skeleton mb-2" style="height: 80px;"></div>
          <div class="card skeleton mb-2" style="height: 80px;"></div>
        </div>
      </div>
    </main>
  </div>

  <script>
    async function loadNotifications() {
      const list = document.getElementById('notifications-list');
      try {
        const notifs = await api.notifications.getAll();
        if (notifs.length === 0) {
          list.innerHTML = `
            <div class="card empty-state">
              <i data-lucide="bell-off"></i>
              <h3>All caught up!</h3>
              <p>No new notifications at the moment.</p>
            </div>`;
          initIcons();
          return;
        }

        list.innerHTML = notifs.map(n => renderNotificationCard(n)).join('');
        initIcons();
      } catch (err) {
        list.innerHTML = `<p class="error-msg">Failed to load notifications: ${err.message}</p>`;
      }
    }

    function renderNotificationCard(n) {
      const typeIcons = {
        like: { icon: 'heart', class: 'notif-icon-like' },
        comment: { icon: 'message-square', class: 'notif-icon-comment' },
        community_join: { icon: 'user-plus', class: 'notif-icon-community' },
        assignment_due: { icon: 'clock', class: 'notif-icon-comment' }
      };
      const type = typeIcons[n.type] || { icon: 'bell', class: 'notif-icon-comment' };

      return `
        <div class="card notif-card ${n.read ? '' : 'unread'} card-clickable" onclick="handleNotifClick(${n.id}, '${n.link}')">
          <div class="notif-icon-box ${type.class}">
            <i data-lucide="${type.icon}" style="width:18px; height:18px;"></i>
          </div>
          <div class="notif-content">
            <div class="notif-text">${esc(n.content)}</div>
            <div class="notif-time">${formatTimeAgo(n.created_at)}</div>
          </div>
          ${!n.read ? '<div style="width:8px; height:8px; background:var(--color-primary-500); border-radius:50%; align-self:center;"></div>' : ''}
        </div>
      `;
    }

    async function handleNotifClick(id, link) {
      try {
        await api.notifications.markRead(id);
        if (link) window.location.href = link;
        else loadNotifications();
      } catch (err) { console.error(err); }
    }

    async function handleMarkAllRead() {
      try {
        await api.notifications.markAllRead();
        loadNotifications();
      } catch (err) { alert(err.message); }
    }

    document.addEventListener('DOMContentLoaded', async () => {
      const user = JSON.parse(localStorage.getItem('currentUser'));
      document.getElementById('nav-mount').outerHTML = renderNav('notifications', user);
      initIcons();
      loadNotifications();
    });
  </script>
</body>
</html>
