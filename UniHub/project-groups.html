<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Project Groups | UniHub</title>
  <link rel="stylesheet" href="styles.css">
  <link rel="icon" type="image/png" href="logo/unihub.png">
  <script src="https://unpkg.com/lucide@latest"></script>
  <script src="js/config.js" defer></script>
  <script src="js/api.js" defer></script>
  <script src="nav.js" defer></script>
  <script src="js/app.js" defer></script>
  <style>
    .group-grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(320px, 1fr)); gap: var(--space-6); }
    .group-card { height: 100%; display: flex; flex-direction: column; }
    .group-header { display: flex; align-items: flex-start; gap: var(--space-4); margin-bottom: var(--space-4); }
    .group-icon {
      width: 44px; height: 44px; border-radius: var(--radius-md);
      background: var(--color-surface-2); display: flex; align-items: center; justify-content: center;
      color: var(--color-primary-600); flex-shrink: 0;
    }
    .group-title { font-size: var(--text-base); font-weight: var(--font-bold); line-height: 1.3; }
    .member-avatars { display: flex; margin-left: var(--space-1); }
    .member-avatar-mini {
      width: 28px; height: 28px; border-radius: 50%;
      border: 2px solid var(--color-surface); background: var(--color-primary-100);
      margin-left: -8px; display: flex; align-items: center; justify-content: center;
      font-size: 10px; font-weight: var(--font-bold);
    }
  </style>
</head>
<body>
  <div id="nav-mount"></div>

  <div class="app-shell">
    <main class="main">
      <div class="page-content">
        <div class="page-header">
          <div>
            <h1>Project Groups</h1>
            <p>Collaborate with your team on projects and study groups</p>
          </div>
          <button class="btn btn-primary" onclick="openCreateGroupModal()">
            <i data-lucide="plus"></i> Create Group
          </button>
        </div>

        <div class="tabs mb-8">
          <button class="tab-btn active" onclick="switchGroupTab('my', this)">My Groups</button>
          <button class="tab-btn" onclick="switchGroupTab('discover', this)">Discover</button>
        </div>

        <div class="group-grid" id="groups-list">
          <!-- Skeletons -->
          <div class="card skeleton" style="height: 200px;"></div>
          <div class="card skeleton" style="height: 200px;"></div>
          <div class="card skeleton" style="height: 200px;"></div>
        </div>
      </div>
    </main>
  </div>

  <script>
    let groupFilter = 'my';

    async function loadGroups() {
      const list = document.getElementById('groups-list');
      try {
        const groups = groupFilter === 'my' ? await api.projectGroups.getMy() : await api.projectGroups.getAll();
        renderGroups(groups);
      } catch (err) {
        list.innerHTML = `<div class="card empty-state" style="grid-column:1/-1;">
          <i data-lucide="alert-circle"></i>
          <h3>Failed to load groups</h3>
          <p>${err.message}</p>
        </div>`;
        initIcons();
      }
    }

    function renderGroups(items) {
      const list = document.getElementById('groups-list');
      if (items.length === 0) {
        list.innerHTML = `
          <div class="card empty-state" style="grid-column: 1/-1;">
            <i data-lucide="layers"></i>
            <h3>No groups found</h3>
            <p>${groupFilter === 'my' ? "You haven't joined any project groups yet." : "There are no public groups available to join right now."}</p>
            ${groupFilter === 'my' ? '<button class="btn btn-primary mt-4" onclick="switchGroupTab(\'discover\', document.querySelectorAll(\'.tab-btn\')[1])">Discover Groups</button>' : ''}
          </div>`;
        initIcons();
        return;
      }

      list.innerHTML = items.map(g => renderGroupCard(g)).join('');
      initIcons();
    }

    function renderGroupCard(g) {
      return `
        <div class="card group-card card-clickable" onclick="window.location.href='group-detail.html?id=${g.id}'">
          <div class="group-header">
            <div class="group-icon"><i data-lucide="users"></i></div>
            <div style="flex:1;">
              <h3 class="group-title">${esc(g.name)}</h3>
              <div class="tag tag-gray" style="font-size:10px; margin-top:4px;">${esc(g.community_name || 'Project')}</div>
            </div>
          </div>
          <p style="font-size:var(--text-sm); color:var(--color-text-muted); line-height:var(--leading-normal); flex:1; margin-bottom:var(--space-4);">
            ${esc(g.description || 'A collaborative space for project work.')}
          </p>
          <div class="flex-between" style="padding-top:var(--space-4); border-top:1px solid var(--color-border);">
            <div class="member-avatars">
              ${(g.members || []).slice(0, 3).map(m => `
                <div class="member-avatar-mini" title="${esc(m.username)}">${m.username[0].toUpperCase()}</div>
              `).join('')}
              ${(g.members || []).length > 3 ? `<div class="member-avatar-mini" style="background:var(--color-surface-2); color:var(--color-text-muted);">+${g.members.length - 3}</div>` : ''}
            </div>
            <span style="font-size:var(--text-xs); color:var(--color-text-subtle); font-weight:var(--font-medium);">${g.member_count || 0} Members</span>
          </div>
        </div>
      `;
    }

    function switchGroupTab(val, btn) {
      groupFilter = val;
      document.querySelectorAll('.tab-btn').forEach(b => b.classList.remove('active'));
      btn.classList.add('active');
      loadGroups();
    }

    document.addEventListener('DOMContentLoaded', async () => {
      const user = JSON.parse(localStorage.getItem('currentUser'));
      document.getElementById('nav-mount').outerHTML = renderNav('project-groups', user);
      initIcons();
      loadGroups();
    });
  </script>
</body>
</html>
