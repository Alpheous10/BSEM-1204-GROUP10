<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>UniHub | Your Academic Hub</title>
  <link rel="stylesheet" href="styles.css">
  <link rel="icon" type="image/png" href="logo/unihub.png">
  <script src="https://unpkg.com/lucide@latest"></script>
  <script src="js/api.js" defer></script>
  <script src="js/app.js" defer></script>
  <style>
    /* Auth Page Styles */
    body { background: white; }
    .auth-container { display: grid; grid-template-columns: 1fr 1fr; min-height: 100vh; }
    .auth-sidebar {
      background: linear-gradient(135deg, var(--color-primary-700), var(--color-primary-600));
      color: white; padding: var(--space-16);
      display: flex; flex-direction: column; justify-content: center;
    }
    .auth-sidebar .logo-mark { background: white; color: var(--color-primary-600); width: 48px; height: 48px; font-size: 24px; margin-bottom: var(--space-6); }
    .auth-sidebar h1 { font-size: var(--text-3xl); font-weight: var(--font-bold); margin-bottom: var(--space-4); }
    .auth-sidebar p { font-size: var(--text-lg); opacity: 0.9; margin-bottom: var(--space-12); }
    .feature-list { display: flex; flex-direction: column; gap: var(--space-6); }
    .feature-item { display: flex; align-items: center; gap: var(--space-4); font-size: var(--text-base); font-weight: var(--font-medium); }
    .feature-icon { width: 32px; height: 32px; border-radius: 8px; background: rgba(255,255,255,0.1); display: flex; align-items: center; justify-content: center; }

    .auth-form-panel { display: flex; align-items: center; justify-content: center; padding: var(--space-8); }
    .auth-card { width: 100%; max-width: 400px; }
    .auth-tabs { display: flex; border-bottom: 2px solid var(--color-surface-2); margin-bottom: var(--space-8); }
    .auth-tab { flex: 1; padding: var(--space-4); text-align: center; cursor: pointer; font-weight: var(--font-semibold); color: var(--color-text-muted); transition: all 150ms; }
    .auth-tab.active { color: var(--color-primary-600); border-bottom: 2px solid var(--color-primary-600); margin-bottom: -2px; }

    .error-box { background: var(--color-danger-100); color: var(--color-danger-500); padding: var(--space-3); border-radius: var(--radius-md); font-size: var(--text-sm); margin-bottom: var(--space-4); display: none; }

    @media (max-width: 768px) {
      .auth-container { grid-template-columns: 1fr; }
      .auth-sidebar { display: none; }
    }
  </style>
</head>
<body>
  <div class="auth-container">
    <!-- Sidebar -->
    <aside class="auth-sidebar">
      <img src="logo/unihub.png" alt="UniHub Logo" class="logo-mark" style="object-fit: cover;">
      <h1>Your Academic Hub,<br>all in one place.</h1>
      <p>UniHub is the productivity workspace for university students.</p>
      
      <div class="feature-list">
        <div class="feature-item">
          <div class="feature-icon"><i data-lucide="users"></i></div>
          Join course communities
        </div>
        <div class="feature-item">
          <div class="feature-icon"><i data-lucide="folder"></i></div>
          Share and access lecture notes
        </div>
        <div class="feature-item">
          <div class="feature-icon"><i data-lucide="clipboard"></i></div>
          Track your assignments
        </div>
        <div class="feature-item">
          <div class="feature-icon"><i data-lucide="message-square"></i></div>
          Discuss academic topics
        </div>
      </div>
    </aside>

    <!-- Form Panel -->
    <main class="auth-form-panel">
      <div class="auth-card">
        <div class="auth-tabs">
          <div class="auth-tab active" onclick="switchAuthTab('login')">Sign In</div>
          <div class="auth-tab" onclick="switchAuthTab('register')">Create Account</div>
        </div>

        <!-- Login Form -->
        <div id="login-section">
          <div id="login-error" class="error-box"></div>
          <div class="form-group">
            <label class="form-label">Username</label>
            <input type="text" class="form-control" id="l-email" placeholder="Enter your username">
          </div>
          <div class="form-group">
            <label class="form-label">Password</label>
            <input type="password" class="form-control" id="l-password" placeholder="••••••••">
          </div>
          <button class="btn btn-primary btn-full" id="login-btn" onclick="handleLogin()">Sign In</button>
        </div>

        <!-- Register Form -->
        <div id="register-section" style="display:none;">
          <div id="register-error" class="error-box"></div>
          <form id="register-form" onsubmit="event.preventDefault(); handleRegister();">
            <div class="form-group">
              <label class="form-label">Username</label>
              <input type="text" name="username" class="form-control" id="r-username" placeholder="johndoe">
            </div>
            <div class="form-group">
              <label class="form-label">Full Name</label>
              <input type="text" name="full_name" class="form-control" placeholder="John Doe">
            </div>
            <div class="form-group">
              <label class="form-label">Email Address</label>
              <input type="email" name="email" class="form-control" id="r-email" placeholder="john@university.edu">
            </div>
            <div class="form-group">
              <label class="form-label">Password</label>
              <input type="password" name="password" class="form-control" id="r-password" placeholder="At least 6 characters">
            </div>
            <div class="grid-2">
              <div class="form-group">
                <label class="form-label">Department</label>
                <input type="text" name="department" class="form-control" placeholder="Computer Science">
              </div>
              <div class="form-group">
                <label class="form-label">Academic Year</label>
                <select name="academic_year" class="form-control">
                  <option value="Year 1">Year 1</option>
                  <option value="Year 2">Year 2</option>
                  <option value="Year 3">Year 3</option>
                  <option value="Year 4">Year 4</option>
                  <option value="Year 5">Year 5</option>
                  <option value="Graduate">Graduate</option>
                </select>
              </div>
            </div>
            <button type="submit" class="btn btn-primary btn-full" id="register-btn">Create Account</button>
          </form>
        </div>
      </div>
    </main>
  </div>

  <script>
    function switchAuthTab(tab) {
      const tabs = document.querySelectorAll('.auth-tab');
      const loginSec = document.getElementById('login-section');
      const registerSec = document.getElementById('register-section');
      
      tabs.forEach(t => t.classList.remove('active'));
      if (tab === 'login') {
        tabs[0].classList.add('active');
        loginSec.style.display = 'block';
        registerSec.style.display = 'none';
      } else {
        tabs[1].classList.add('active');
        loginSec.style.display = 'none';
        registerSec.style.display = 'block';
      }
    }

    document.addEventListener('DOMContentLoaded', () => {
      if (window.lucide) lucide.createIcons();
    });
  </script>
</body>
</html>
