<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Community Detail | UniHub</title>
  <link rel="stylesheet" href="styles.css">
  <link rel="icon" type="image/png" href="logo/unihub.png">
  <script src="https://unpkg.com/lucide@latest"></script>
  <script src="js/config.js" defer></script>
  <script src="js/api.js" defer></script>
  <script src="nav.js" defer></script>
  <script src="js/app.js" defer></script>
  <style>
    .comm-detail-header {
      background: var(--color-surface);
      border: 1px solid var(--color-border);
      border-radius: var(--radius-lg);
      padding: var(--space-8);
      margin-bottom: var(--space-8);
      display: flex;
      gap: var(--space-8);
      align-items: center;
      box-shadow: var(--shadow-sm);
    }
    .comm-avatar-xl {
      width: 100px; height: 100px; border-radius: var(--radius-lg);
      background: var(--color-primary-50);
      display: flex; align-items: center; justify-content: center;
      font-size: 48px; flex-shrink: 0;
      box-shadow: var(--shadow-sm);
    }
    .comm-info-main { flex: 1; }
    .comm-info-main h1 { font-size: var(--text-2xl); font-weight: var(--font-bold); margin-bottom: var(--space-2); }
    .comm-info-main p { color: var(--color-text-muted); font-size: var(--text-base); line-height: var(--leading-normal); max-width: 800px; }
    
    .comm-content-grid {
      display: grid;
      grid-template-columns: 1fr 300px;
      gap: var(--space-8);
    }

    @media (max-width: 1024px) {
      .comm-detail-header { flex-direction: column; text-align: center; gap: var(--space-4); }
      .comm-content-grid { grid-template-columns: 1fr; }
    }
  </style>
</head>
<body>
  <div id="nav-mount"></div>

  <div class="app-shell">
    <main class="main">
      <div class="page-content">
        <div id="community-header-mount">
          <!-- Skeleton -->
          <div class="comm-detail-header skeleton" style="height: 180px;"></div>
        </div>

        <div class="tabs mb-8" id="community-tabs">
          <button class="tab-btn active" onclick="switchTab('feed', this)">Feed</button>
          <button class="tab-btn" onclick="switchTab('resources', this)">Resources</button>
          <button class="tab-btn" onclick="switchTab('assignments', this)">Assignments</button>
          <button class="tab-btn" onclick="switchTab('members', this)">Members</button>
        </div>

        <div class="comm-content-grid">
          <div id="tab-content">
            <!-- Feed will be default -->
            <div class="flex-between mb-4">
              <h2 style="font-size: var(--text-lg); font-weight: var(--font-bold);">Discussions</h2>
              <button class="btn btn-primary btn-sm" onclick="openCreatePostModal()">
                <i data-lucide="plus"></i> New Post
              </button>
            </div>
            <div id="posts-list">
              <div class="card skeleton mb-4" style="height: 160px;"></div>
              <div class="card skeleton mb-4" style="height: 160px;"></div>
            </div>
          </div>

          <aside class="comm-sidebar">
            <div class="card mb-6">
              <h3 class="rail-section h3" style="font-size: var(--text-xs); font-weight: var(--font-bold); text-transform: uppercase; color: var(--color-text-subtle); margin-bottom: var(--space-4);">About Community</h3>
              <div id="comm-stats-side">
                <div class="flex-between mb-2">
                  <span style="font-size: var(--text-sm); color: var(--color-text-muted);">Members</span>
                  <span style="font-weight: var(--font-bold);" id="side-member-count">0</span>
                </div>
                <div class="flex-between mb-2">
                  <span style="font-size: var(--text-sm); color: var(--color-text-muted);">Posts</span>
                  <span style="font-weight: var(--font-bold);" id="side-post-count">0</span>
                </div>
                <div class="flex-between">
                  <span style="font-size: var(--text-sm); color: var(--color-text-muted);">Created</span>
                  <span style="font-weight: var(--font-bold);" id="side-created-date">-</span>
                </div>
              </div>
            </div>
            
            <div class="card">
              <h3 class="rail-section h3" style="font-size: var(--text-xs); font-weight: var(--font-bold); text-transform: uppercase; color: var(--color-text-subtle); margin-bottom: var(--space-4);">Pinned Posts</h3>
              <div id="pinned-posts-list">
                <p class="empty-state" style="padding: var(--space-4); font-size: var(--text-sm);">No pinned posts.</p>
              </div>
            </div>
          </aside>
        </div>
      </div>
    </main>
  </div>

  <script>
    let communityId = new URLSearchParams(window.location.search).get('id');
    let currentCommunity = null;
    let activeTab = 'feed';

    async function loadCommunityDetail() {
      try {
        currentCommunity = await api.communities.get(communityId);
        const myCommIds = (await api.communities.getMy()).map(c => c.id);
        const isJoined = myCommIds.includes(parseInt(communityId));

        document.getElementById('community-header-mount').innerHTML = `
          <div class="comm-detail-header">
            <div class="comm-avatar-xl">${currentCommunity.icon || '🎓'}</div>
            <div class="comm-info-main">
              <h1>${esc(currentCommunity.name)}</h1>
              <p>${esc(currentCommunity.description || 'Welcome to this academic community!')}</p>
            </div>
            <div class="comm-actions">
              ${isJoined ? 
                `<button class="btn btn-outline" onclick="handleLeave()">Leave Community</button>` :
                `<button class="btn btn-primary" onclick="handleJoin()">Join Community</button>`
              }
            </div>
          </div>
        `;

        document.getElementById('side-member-count').textContent = currentCommunity.member_count;
        document.getElementById('side-post-count').textContent = currentCommunity.post_count || 0;
        document.getElementById('side-created-date').textContent = new Date(currentCommunity.created_at).toLocaleDateString();

        loadTabContent();
        initIcons();
      } catch (err) {
        console.error(err);
      }
    }

    async function loadTabContent() {
      const container = document.getElementById('tab-content');
      
      if (activeTab === 'feed') {
        container.innerHTML = `
          <div class="flex-between mb-6">
            <h2 style="font-size: var(--text-xl); font-weight: var(--font-bold);">Discussions</h2>
            <button class="btn btn-primary" onclick="openCreatePostModal()">
              <i data-lucide="plus"></i> New Post
            </button>
          </div>
          <div id="posts-list"></div>
        `;
        const posts = await api.posts.getAll(0, 50, communityId);
        const list = document.getElementById('posts-list');
        if (posts.length === 0) {
          list.innerHTML = `
            <div class="card empty-state">
              <i data-lucide="message-square"></i>
              <h3>No discussions yet</h3>
              <p>Be the first to share something with this community!</p>
              <button class="btn btn-primary mt-4" onclick="openCreatePostModal()">Create First Post</button>
            </div>`;
        } else {
          list.innerHTML = posts.map(p => renderDiscussionCard(p)).join('');
        }
      } else if (activeTab === 'resources') {
        container.innerHTML = `
          <div class="flex-between mb-6">
            <h2 style="font-size: var(--text-xl); font-weight: var(--font-bold);">Resources</h2>
            <button class="btn btn-primary" onclick="openUploadResourceModal()">
              <i data-lucide="upload"></i> Upload
            </button>
          </div>
          <div id="resources-list" class="grid-2"></div>
        `;
        const resources = await api.resources.getAll(0, 50, communityId);
        const list = document.getElementById('resources-list');
        if (resources.length === 0) {
          list.innerHTML = `
            <div class="card empty-state col-span-2">
              <i data-lucide="folder-open"></i>
              <h3>No resources yet</h3>
              <p>Be the first to upload lecture notes or study guides.</p>
              <button class="btn btn-primary mt-4" onclick="openUploadResourceModal()">Upload Resource</button>
            </div>`;
        } else {
          list.innerHTML = resources.map(r => renderResourceCardFull(r)).join('');
        }
      } else if (activeTab === 'assignments') {
        container.innerHTML = `
          <div class="flex-between mb-6">
            <h2 style="font-size: var(--text-xl); font-weight: var(--font-bold);">Assignments</h2>
            <button class="btn btn-primary" onclick="openCreateAssignmentModal()">
              <i data-lucide="plus"></i> New Assignment
            </button>
          </div>
          <div id="assignments-list"></div>
        `;
        const assignments = await api.assignments.getAll(0, 50, communityId);
        const list = document.getElementById('assignments-list');
        if (assignments.length === 0) {
          list.innerHTML = `
            <div class="card empty-state">
              <i data-lucide="clipboard-list"></i>
              <h3>No assignments tracked</h3>
              <p>Keep track of upcoming deadlines in this community.</p>
              <button class="btn btn-primary mt-4" onclick="openCreateAssignmentModal()">Add Assignment</button>
            </div>`;
        } else {
          list.innerHTML = assignments.map(a => renderAssignmentCardFull(a)).join('');
        }
      } else if (activeTab === 'members') {
        container.innerHTML = `
          <div class="flex-between mb-6">
            <h2 style="font-size: var(--text-xl); font-weight: var(--font-bold);">Members</h2>
          </div>
          <div id="members-list" class="grid-2"></div>
        `;
        const members = await api.communities.getMembers(communityId);
        const list = document.getElementById('members-list');
        list.innerHTML = members.map(m => renderUserCard(m)).join('');
      }
      initIcons();
    }

    function renderResourceCardFull(r) {
      const typeIcons = { pdf: 'file-text', docx: 'file-text', pptx: 'presentation', xlsx: 'table', png: 'image', jpg: 'image' };
      const icon = typeIcons[r.file_type.toLowerCase()] || 'file';
      return `
        <div class="card card-clickable" style="padding: var(--space-4);" onclick="window.open('${api.resources.download(r.id)}', '_blank')">
          <div style="display:flex; gap:var(--space-4);">
            <div style="width:48px; height:48px; border-radius:var(--radius-md); background:var(--color-primary-50); color:var(--color-primary-600); display:flex; align-items:center; justify-content:center;">
              <i data-lucide="${icon}"></i>
            </div>
            <div style="flex:1; min-width:0;">
              <div style="font-weight:var(--font-bold); margin-bottom:2px; white-space:nowrap; overflow:hidden; text-overflow:ellipsis;">${esc(r.title)}</div>
              <div style="font-size:11px; color:var(--color-text-subtle); margin-bottom:var(--space-2);">${r.file_type.toUpperCase()} • ${(r.file_size/1024).toFixed(1)} KB</div>
              <div style="font-size:10px; color:var(--color-text-muted);">Uploaded by ${esc(r.uploader_name)} • ${formatTimeAgo(r.created_at)}</div>
            </div>
          </div>
        </div>
      `;
    }

    function renderAssignmentCardFull(a) {
      const dueDate = new Date(a.due_date);
      return `
        <div class="card card-clickable mb-4" style="padding: var(--space-4);" onclick="openAssignmentDetail(${a.id})">
          <div class="flex-between">
            <div style="flex:1;">
              <h3 style="font-size:var(--text-base); font-weight:var(--font-bold); margin-bottom:4px;">${esc(a.title)}</h3>
              <p style="font-size:var(--text-sm); color:var(--color-text-muted); margin-bottom:8px;">${esc(a.description || 'No description')}</p>
              <div class="flex-center gap-4" style="justify-content: flex-start;">
                <span style="font-size:11px; color:var(--color-text-subtle); display:flex; align-items:center; gap:4px;">
                  <i data-lucide="calendar" style="width:12px;"></i> Due: ${dueDate.toLocaleDateString()}
                </span>
                <span class="tag ${a.completed ? 'tag-green' : 'tag-orange'}" style="font-size:10px;">
                  ${a.completed ? 'COMPLETED' : 'PENDING'}
                </span>
              </div>
            </div>
            <i data-lucide="chevron-right" style="color:var(--color-text-subtle);"></i>
          </div>
        </div>
      `;
    }

    function renderUserCard(u) {
      const initials = (u.full_name || u.username)[0].toUpperCase();
      return `
        <div class="card card-clickable" onclick="window.location.href='profile.html?id=${u.id}'" style="padding: var(--space-4);">
          <div style="display:flex; align-items:center; gap:var(--space-3);">
            <div class="topbar-avatar" style="width:40px; height:40px; font-size:14px;">${initials}</div>
            <div style="flex:1; min-width:0;">
              <div style="font-weight:var(--font-bold); white-space:nowrap; overflow:hidden; text-overflow:ellipsis;">${esc(u.full_name || u.username)}</div>
              <div style="font-size:11px; color:var(--color-text-subtle);">@${esc(u.username)}</div>
            </div>
          </div>
        </div>
      `;
    }

    async function openCreateAssignmentModal() {
      const modalHtml = `
        <div class="modal-overlay open" id="create-assignment-modal">
          <div class="modal-container">
            <div class="modal-header">
              <h2>Add Assignment</h2>
              <i data-lucide="x" class="modal-close" onclick="closeModal('create-assignment-modal')"></i>
            </div>
            <form id="create-assignment-form" onsubmit="event.preventDefault(); handleCreateAssignment();">
              <input type="hidden" name="community_id" value="${communityId}">
              <div class="form-group">
                <label class="form-label">Title</label>
                <input type="text" name="title" class="form-control" placeholder="e.g. Math Midterm" required>
              </div>
              <div class="form-group">
                <label class="form-label">Description</label>
                <textarea name="description" class="form-control" rows="3" placeholder="Additional details..."></textarea>
              </div>
              <div class="form-group">
                <label class="form-label">Due Date</label>
                <input type="datetime-local" name="due_date" class="form-control" required>
              </div>
              <div class="flex-center mt-4">
                <button type="submit" class="btn btn-primary btn-full" id="create-assign-btn">Add Assignment</button>
              </div>
            </form>
          </div>
        </div>
      `;
      document.body.insertAdjacentHTML('beforeend', modalHtml);
      initIcons();
    }

    async function handleCreateAssignment() {
      const form = document.getElementById('create-assignment-form');
      const btn = document.getElementById('create-assign-btn');
      const formData = new FormData(form);
      const data = Object.fromEntries(formData.entries());
      try {
        setLoading(btn, true);
        await api.assignments.create(data);
        closeModal('create-assignment-modal');
        loadTabContent();
      } catch (err) { alert(err.message); } finally { setLoading(btn, false); }
    }

    function switchTab(tab, btn) {
      activeTab = tab;
      document.querySelectorAll('.tab-btn').forEach(b => b.classList.remove('active'));
      btn.classList.add('active');
      loadTabContent();
    }

    async function handleJoin() {
      try { await api.communities.join(communityId); loadCommunityDetail(); } catch (err) { alert(err.message); }
    }
    async function handleLeave() {
      try { await api.communities.leave(communityId); loadCommunityDetail(); } catch (err) { alert(err.message); }
    }

    document.addEventListener('DOMContentLoaded', async () => {
      const user = JSON.parse(localStorage.getItem('currentUser'));
      document.getElementById('nav-mount').outerHTML = renderNav('communities', user);
      initIcons();
      loadCommunityDetail();
    });
  </script>
</body>
</html>
