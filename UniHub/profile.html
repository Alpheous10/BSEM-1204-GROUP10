<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>My Profile | UniHub</title>
  <link rel="stylesheet" href="styles.css">
  <link rel="icon" type="image/png" href="logo/unihub.png">
  <script src="https://unpkg.com/lucide@latest"></script>
  <script src="js/config.js" defer></script>
  <script src="js/api.js" defer></script>
  <script src="nav.js" defer></script>
  <script src="js/app.js" defer></script>
  <style>
    .profile-header { background: var(--color-surface); border: 1px solid var(--color-border); border-radius: var(--radius-lg); padding: var(--space-8); margin-bottom: var(--space-8); display: flex; gap: var(--space-8); align-items: center; }
    .profile-avatar-large { width: 120px; height: 120px; border-radius: 50%; background: linear-gradient(135deg, var(--color-primary-600), var(--color-primary-500)); color: white; display: flex; align-items: center; justify-content: center; font-size: 48px; font-weight: var(--font-bold); box-shadow: var(--shadow-md); }
    .profile-info h1 { font-size: var(--text-2xl); font-weight: var(--font-bold); margin-bottom: var(--space-1); }
    .profile-info .username { color: var(--color-text-muted); margin-bottom: var(--space-4); }
    .profile-stats { display: flex; gap: var(--space-8); margin-bottom: var(--space-6); }
    .profile-stat { display: flex; flex-direction: column; }
    .profile-stat .val { font-size: var(--text-lg); font-weight: var(--font-bold); color: var(--color-text); }
    .profile-stat .lbl { font-size: var(--text-xs); color: var(--color-text-muted); text-transform: uppercase; letter-spacing: 0.5px; }
    
    .profile-grid { display: grid; grid-template-columns: 1fr var(--right-rail-width); gap: var(--space-8); }
    
    @media (max-width: 1024px) {
      .profile-header { flex-direction: column; text-align: center; gap: var(--space-4); }
      .profile-stats { justify-content: center; }
      .profile-grid { grid-template-columns: 1fr; }
    }
  </style>
</head>
<body>
  <div id="nav-mount"></div>

  <div class="app-shell">
    <main class="main">
      <div class="page-content">
        <div id="profile-mount">
          <!-- Skeleton -->
          <div class="profile-header skeleton" style="height: 240px; margin-bottom: var(--space-8);"></div>
        </div>

        <div class="profile-grid">
          <div class="profile-main">
            <div class="tabs mb-8">
              <button class="tab-btn active" onclick="switchProfileTab('posts', this)">Posts</button>
              <button class="tab-btn" onclick="switchProfileTab('communities', this)">Communities</button>
              <button class="tab-btn" onclick="switchProfileTab('following', this)">Following</button>
            </div>
            <div id="profile-posts-list">
              <div class="card skeleton mb-4" style="height: 160px;"></div>
              <div class="card skeleton mb-4" style="height: 160px;"></div>
            </div>
          </div>

          <aside class="profile-sidebar">
            <div class="card mb-6">
              <h3 class="rail-section h3" style="font-size: var(--text-xs); font-weight: var(--font-bold); text-transform: uppercase; color: var(--color-text-subtle); margin-bottom: var(--space-4);">Academic Info</h3>
              <div id="profile-about-details">
                <div class="skeleton mb-2" style="height: 20px;"></div>
                <div class="skeleton mb-2" style="height: 20px;"></div>
              </div>
            </div>
            
            <div class="card">
              <h3 class="rail-section h3" style="font-size: var(--text-xs); font-weight: var(--font-bold); text-transform: uppercase; color: var(--color-text-subtle); margin-bottom: var(--space-4);">Bio</h3>
              <p id="profile-bio-text" style="font-size: var(--text-sm); color: var(--color-text-muted); line-height: var(--leading-normal);">
                Loading...
              </p>
            </div>
          </aside>
        </div>
      </div>
    </main>
  </div>

  <script>
    async function loadProfile() {
      const urlParams = new URLSearchParams(window.location.search);
      const userId = urlParams.get('id') || 'me';
      
      try {
        const user = userId === 'me' ? await api.users.me() : await api.users.getUser(userId);
        const posts = await api.users.getUserPosts(user.id);
        
        // Header
        const initials = (user.full_name || user.username)[0].toUpperCase();
        document.getElementById('profile-mount').innerHTML = `
          <div class="profile-header">
            <div class="profile-avatar-large">${initials}</div>
            <div class="profile-info">
              <h1>${esc(user.full_name || user.username)}</h1>
              <div class="username">@${esc(user.username)}</div>
              <div class="profile-stats">
                <div class="profile-stat">
                  <span class="val">${user.follower_count || 0}</span>
                  <span class="lbl">Followers</span>
                </div>
                <div class="profile-stat">
                  <span class="val">${user.following_count || 0}</span>
                  <span class="lbl">Following</span>
                </div>
                <div class="profile-stat">
                  <span class="val">${posts.length}</span>
                  <span class="lbl">Posts</span>
                </div>
              </div>
              <div class="flex-center gap-4">
                ${userId === 'me' ? 
                  '<button class="btn btn-primary" onclick="window.location.href=\'settings.html\'"><i data-lucide="edit-3"></i> Edit Profile</button>' :
                  '<button class="btn btn-primary"><i data-lucide="user-plus"></i> Follow</button>'
                }
                <button class="btn btn-outline icon-btn"><i data-lucide="share-2"></i></button>
              </div>
            </div>
          </div>
        `;

        // About & Bio
        document.getElementById('profile-about-details').innerHTML = `
          <div class="mb-4">
            <div style="color:var(--color-text-subtle); font-size:10px; font-weight:bold; text-transform:uppercase; margin-bottom:4px;">Department</div>
            <div style="font-weight:var(--font-semibold); font-size:var(--text-sm);">${esc(user.department || 'Not specified')}</div>
          </div>
          <div>
            <div style="color:var(--color-text-subtle); font-size:10px; font-weight:bold; text-transform:uppercase; margin-bottom:4px;">Academic Year</div>
            <div style="font-weight:var(--font-semibold); font-size:var(--text-sm);">${esc(user.academic_year || 'Not specified')}</div>
          </div>
        `;
        document.getElementById('profile-bio-text').textContent = user.bio || 'No bio available.';

        // Posts
        const postsContainer = document.getElementById('profile-posts-list');
        if (posts.length === 0) {
          postsContainer.innerHTML = `
            <div class="card empty-state">
              <i data-lucide="message-square"></i>
              <h3>No posts yet</h3>
              <p>${userId === 'me' ? "You haven't shared anything with the community yet." : "This user hasn't posted anything yet."}</p>
            </div>`;
        } else {
          postsContainer.innerHTML = posts.map(p => renderDiscussionCard(p)).join('');
        }
        
        initIcons();
      } catch (err) {
        document.getElementById('profile-mount').innerHTML = `<div class="card empty-state"><h3>Profile error</h3><p>${err.message}</p></div>`;
      }
    }

    async function switchProfileTab(tab, btn) {
      document.querySelectorAll('.tab-btn').forEach(b => b.classList.remove('active'));
      btn.classList.add('active');
      
      const postsContainer = document.getElementById('profile-posts-list');
      const urlParams = new URLSearchParams(window.location.search);
      const userId = urlParams.get('id') || 'me';
      
      try {
        postsContainer.innerHTML = '<div class="card skeleton mb-4" style="height: 160px;"></div>';
        
        if (tab === 'posts') {
          const user = userId === 'me' ? await api.users.me() : await api.users.getUser(userId);
          const posts = await api.users.getUserPosts(user.id);
          if (posts.length === 0) {
            postsContainer.innerHTML = `
              <div class="card empty-state">
                <i data-lucide="message-square"></i>
                <h3>No posts yet</h3>
                <p>${userId === 'me' ? "You haven't shared anything with the community yet." : "This user hasn't posted anything yet."}</p>
              </div>`;
          } else {
            postsContainer.innerHTML = posts.map(p => renderDiscussionCard(p)).join('');
          }
        } else if (tab === 'communities') {
          if (userId !== 'me') {
            postsContainer.innerHTML = `<div class="card empty-state"><i data-lucide="lock"></i><h3>Private</h3><p>Community memberships are private.</p></div>`;
          } else {
            const communities = await api.communities.getMy();
            if (communities.length === 0) {
              postsContainer.innerHTML = `<div class="card empty-state"><i data-lucide="users"></i><h3>No communities</h3><p>You haven't joined any communities yet.</p></div>`;
            } else {
              postsContainer.innerHTML = `<div class="grid-2">${communities.map(c => renderCommunityCard(c)).join('')}</div>`;
            }
          }
        } else if (tab === 'following') {
          const user = userId === 'me' ? await api.users.me() : await api.users.getUser(userId);
          const following = await api.users.getFollowing(user.id);
          if (following.length === 0) {
            postsContainer.innerHTML = `<div class="card empty-state"><i data-lucide="user"></i><h3>Not following anyone</h3><p>${userId === 'me' ? "You're not following anyone yet." : "This user isn't following anyone yet."}</p></div>`;
          } else {
            postsContainer.innerHTML = `<div class="grid-2">${following.map(u => renderUserCard(u)).join('')}</div>`;
          }
        }
        initIcons();
      } catch (err) {
        postsContainer.innerHTML = `<p class="error-msg">${err.message}</p>`;
      }
    }

    function renderCommunityCard(c) {
      return `
        <div class="card card-clickable" onclick="window.location.href='community-detail.html?id=${c.id}'" style="padding: var(--space-4);">
          <div style="display:flex; align-items:center; gap:var(--space-3);">
            <div style="font-size:24px;">${c.icon || '🎓'}</div>
            <div style="flex:1; min-width:0;">
              <div style="font-weight:var(--font-bold); white-space:nowrap; overflow:hidden; text-overflow:ellipsis;">${esc(c.name)}</div>
              <div style="font-size:11px; color:var(--color-text-subtle);">${c.member_count || 0} members</div>
            </div>
          </div>
        </div>
      `;
    }

    function renderUserCard(u) {
      const initials = (u.full_name || u.username)[0].toUpperCase();
      return `
        <div class="card card-clickable" onclick="window.location.href='profile.html?id=${u.id}'" style="padding: var(--space-4);">
          <div style="display:flex; align-items:center; gap:var(--space-3);">
            <div class="topbar-avatar" style="width:32px; height:32px; font-size:12px;">${initials}</div>
            <div style="flex:1; min-width:0;">
              <div style="font-weight:var(--font-bold); white-space:nowrap; overflow:hidden; text-overflow:ellipsis;">${esc(u.full_name || u.username)}</div>
              <div style="font-size:11px; color:var(--color-text-subtle);">@${esc(u.username)}</div>
            </div>
          </div>
        </div>
      `;
    }

    document.addEventListener('DOMContentLoaded', async () => {
      const mount = document.getElementById('nav-mount');
      const currentUser = JSON.parse(localStorage.getItem('currentUser'));
      mount.outerHTML = renderNav('profile', currentUser);
      initIcons();
      loadProfile();
    });
  </script>
</body>
</html>
