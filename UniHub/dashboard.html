<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Dashboard | UniHub</title>
  <link rel="stylesheet" href="styles.css">
  <link rel="icon" type="image/png" href="logo/unihub.png">
  <script src="https://unpkg.com/lucide@latest"></script>
  <script src="js/api.js" defer></script>
  <script src="nav.js" defer></script>
  <script src="js/app.js" defer></script>
  <style>
    /* Dashboard Specific Styles */
    .greeting-banner {
      background: linear-gradient(135deg, var(--color-primary-700), var(--color-primary-500));
      color: white;
      padding: var(--space-10);
      border-radius: var(--radius-lg);
      margin-bottom: var(--space-8);
      box-shadow: var(--shadow-md);
      position: relative;
      overflow: hidden;
    }
    .greeting-banner::after {
      content: '';
      position: absolute;
      top: -50px; right: -50px;
      width: 200px; height: 200px;
      background: rgba(255,255,255,0.1);
      border-radius: 50%;
    }
    .greeting-banner h1 { font-size: var(--text-3xl); font-weight: var(--font-bold); margin-bottom: var(--space-2); position: relative; z-index: 1; }
    .greeting-banner p { font-size: var(--text-base); opacity: 0.9; margin-bottom: var(--space-6); position: relative; z-index: 1; max-width: 600px; }

    .stat-row {
      display: grid;
      grid-template-columns: repeat(auto-fit, minmax(200px, 1fr));
      gap: var(--space-6);
      margin-bottom: var(--space-10);
    }
    .stat-card {
      background: var(--color-surface);
      padding: var(--space-5);
      border-radius: var(--radius-lg);
      border: 1px solid var(--color-border);
      display: flex;
      align-items: center;
      gap: var(--space-4);
      cursor: pointer;
      transition: all 150ms ease;
      box-shadow: var(--shadow-sm);
    }
    .stat-card:hover { transform: translateY(-2px); box-shadow: var(--shadow-md); border-color: var(--color-primary-300); }
    .stat-icon {
      width: 48px; height: 48px;
      border-radius: var(--radius-md);
      display: flex; align-items: center; justify-content: center;
      background: var(--color-primary-50);
      color: var(--color-primary-600);
      flex-shrink: 0;
    }
    .stat-icon i { width: 24px; height: 24px; }
    .stat-val { font-size: var(--text-2xl); font-weight: var(--font-bold); color: var(--color-text); line-height: 1; margin-bottom: 2px; }
    .stat-label { font-size: var(--text-xs); color: var(--color-text-muted); font-weight: var(--font-semibold); text-transform: uppercase; letter-spacing: 0.5px; }

    .community-scroll {
      display: flex;
      gap: var(--space-4);
      overflow-x: auto;
      padding: var(--space-1) var(--space-1) var(--space-6);
      margin-bottom: var(--space-4);
      scrollbar-width: thin;
      scrollbar-color: var(--color-border) transparent;
    }
    .community-scroll::-webkit-scrollbar { height: 6px; }
    .community-scroll::-webkit-scrollbar-thumb { background: var(--color-border); border-radius: 10px; }

    .community-chip {
      display: flex;
      align-items: center;
      gap: var(--space-3);
      padding: var(--space-3) var(--space-6);
      background: var(--color-surface);
      border: 1px solid var(--color-border);
      border-radius: var(--radius-full);
      white-space: nowrap;
      cursor: pointer;
      transition: all 150ms ease;
      font-size: var(--text-sm);
      font-weight: var(--font-semibold);
      box-shadow: var(--shadow-sm);
    }
    .community-chip:hover { border-color: var(--color-primary-500); color: var(--color-primary-600); transform: translateY(-1px); box-shadow: var(--shadow-md); }

    .rail-section { margin-bottom: var(--space-8); }
    .rail-section h3 { font-size: var(--text-xs); font-weight: var(--font-bold); text-transform: uppercase; color: var(--color-text-subtle); margin-bottom: var(--space-4); letter-spacing: 1px; }

    .assignment-item {
      display: flex; gap: var(--space-4); padding: var(--space-4) 0; border-bottom: 1px solid var(--color-border);
    }
    .assignment-item:last-child { border-bottom: none; }
    .due-date-badge {
      width: 48px; height: 48px; border-radius: var(--radius-md);
      display: flex; flex-direction: column; align-items: center; justify-content: center;
      background: var(--color-surface-2); font-weight: var(--font-bold); flex-shrink: 0;
    }
    .due-date-badge.urgent { background: var(--color-danger-100); color: var(--color-danger-500); }
    .due-date-badge.soon { background: var(--color-accent-500); color: white; }
    .due-day { font-size: var(--text-xl); line-height: 1; }
    .due-month { font-size: 10px; text-transform: uppercase; line-height: 1; margin-top: 2px; }

    @media (max-width: 768px) {
      .greeting-banner { padding: var(--space-6); }
      .greeting-banner h1 { font-size: var(--text-2xl); }
    }
  </style>
</head>
<body>
  <div id="nav-mount"></div>

  <div class="app-shell">
    <main class="main">
      <div class="page-content">
      <!-- Greeting Banner -->
      <section class="greeting-banner">
        <h1 id="greeting-text">Loading...</h1>
        <p id="greeting-sub">Fetching your daily briefing...</p>
        <button class="btn btn-secondary" onclick="openCreatePostModal()">
          <i data-lucide="plus"></i>
          Start a Discussion
        </button>
      </section>

      <!-- Stat Row -->
      <section class="stat-row">
        <div class="stat-card" onclick="window.location.href='communities.html'">
          <div class="stat-icon"><i data-lucide="users"></i></div>
          <div>
            <div class="stat-val" id="stat-communities">0</div>
            <div class="stat-label">Communities</div>
          </div>
        </div>
        <div class="stat-card" onclick="window.location.href='resources.html'">
          <div class="stat-icon"><i data-lucide="folder"></i></div>
          <div>
            <div class="stat-val" id="stat-resources">0</div>
            <div class="stat-label">Resources</div>
          </div>
        </div>
        <div class="stat-card" onclick="window.location.href='assignments.html'">
          <div class="stat-icon" style="background:var(--color-accent-500); color:white;"><i data-lucide="clipboard"></i></div>
          <div>
            <div class="stat-val" id="stat-assignments">0</div>
            <div class="stat-label">Assignments Due</div>
          </div>
        </div>
        <div class="stat-card" onclick="window.location.href='notifications.html'">
          <div class="stat-icon"><i data-lucide="bell"></i></div>
          <div>
            <div class="stat-val" id="stat-notifs">0</div>
            <div class="stat-label">New Alerts</div>
          </div>
        </div>
      </section>

      <!-- My Communities Horizontal Scroll -->
      <section class="rail-section">
        <h3>My Communities</h3>
        <div class="community-scroll" id="my-communities-scroll">
          <div class="skeleton" style="width: 120px; height: 36px; border-radius: 20px;"></div>
          <div class="skeleton" style="width: 140px; height: 36px; border-radius: 20px;"></div>
          <div class="skeleton" style="width: 100px; height: 36px; border-radius: 20px;"></div>
        </div>
      </section>

      <div class="grid-dash">
        <!-- Main Feed -->
        <section class="feed-area">
          <div class="flex-between mb-4">
            <h2 style="font-size: var(--text-xl); font-weight: var(--font-semibold);">Recent Discussions</h2>
            <a href="communities.html" class="btn btn-ghost btn-sm">Browse all</a>
          </div>
          <div id="dashboard-feed">
            <!-- Skeleton cards -->
            <div class="card skeleton mb-4" style="height: 160px;"></div>
            <div class="card skeleton mb-4" style="height: 160px;"></div>
          </div>
        </section>

        <!-- Right Rail -->
        <aside class="right-rail">
          <!-- Announcements -->
          <section class="rail-section">
            <h3>Announcements</h3>
            <div id="announcements-list">
              <p class="empty-state" style="font-size: var(--text-sm); color: var(--color-text-subtle);">No announcements.</p>
            </div>
          </section>

          <!-- Upcoming Assignments -->
          <section class="rail-section">
            <h3>Upcoming Assignments</h3>
            <div class="card">
              <div id="upcoming-assignments-list">
                <div class="skeleton mb-2" style="height: 60px;"></div>
                <div class="skeleton" style="height: 60px;"></div>
              </div>
            </div>
          </section>

          <!-- Recent Resources -->
          <section class="rail-section">
            <h3>Recent Resources</h3>
            <div id="recent-resources-list">
              <div class="skeleton mb-2" style="height: 50px;"></div>
              <div class="skeleton" style="height: 50px;"></div>
            </div>
          </section>
        </aside>
      </div>
    </div>
  </main>
</div>

<script>
    document.addEventListener('DOMContentLoaded', async () => {
      const mount = document.getElementById('nav-mount');
      const user = JSON.parse(localStorage.getItem('currentUser'));
      mount.outerHTML = renderNav('dashboard', user);
      initIcons();
      
      if (typeof initDashboard === 'function') {
        initDashboard();
      }
    });
  </script>
</body>
</html>
