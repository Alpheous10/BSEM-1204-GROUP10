<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Assignments | UniHub</title>
  <link rel="stylesheet" href="styles.css">
  <link rel="icon" type="image/png" href="logo/unihub.png">
  <script src="https://unpkg.com/lucide@latest"></script>
  <script src="js/config.js" defer></script>
  <script src="js/api.js" defer></script>
  <script src="nav.js" defer></script>
  <script src="js/app.js" defer></script>
  <style>
    .assignment-card { display: flex; gap: var(--space-6); }
    .due-badge-xl {
      width: 64px; height: 64px; border-radius: var(--radius-lg);
      display: flex; flex-direction: column; align-items: center; justify-content: center;
      background: var(--color-surface-2); font-weight: var(--font-bold); flex-shrink: 0;
    }
    .due-badge-xl.urgent { background: var(--color-danger-100); color: var(--color-danger-500); }
    .due-badge-xl.soon { background: var(--color-accent-500); color: white; }
    .due-badge-xl .day { font-size: var(--text-2xl); line-height: 1; }
    .due-badge-xl .month { font-size: 11px; text-transform: uppercase; margin-top: 2px; }

    .assign-main { flex: 1; }
    .assign-title { font-size: var(--text-lg); font-weight: var(--font-bold); margin-bottom: var(--space-1); }
    .assign-comm { font-size: var(--text-sm); color: var(--color-primary-600); font-weight: var(--font-semibold); margin-bottom: var(--space-2); }
    .assign-desc { font-size: var(--text-sm); color: var(--color-text-muted); line-height: var(--leading-normal); }
    
    .status-pill {
      padding: var(--space-1) var(--space-3); border-radius: var(--radius-full);
      font-size: 10px; font-weight: var(--font-bold); text-transform: uppercase;
    }
    .status-pending { background: var(--color-surface-2); color: var(--color-text-muted); }
    .status-done { background: var(--color-success-100); color: var(--color-success-500); }
  </style>
</head>
<body>
  <div id="nav-mount"></div>

  <div class="app-shell">
    <main class="main">
      <div class="page-content">
        <div class="page-header">
          <div>
            <h1>Assignments</h1>
            <p>Track your academic deadlines and tasks</p>
          </div>
          <div class="flex-center gap-4">
            <button class="btn btn-outline" onclick="loadAssignments()">
              <i data-lucide="refresh-cw"></i> Sync
            </button>
            <button class="btn btn-primary" onclick="openCreateAssignmentModal()">
              <i data-lucide="plus"></i> New Assignment
            </button>
          </div>
        </div>

        <div class="tabs mb-8">
          <button class="tab-btn active" onclick="switchAssignFilter('upcoming', this)">Upcoming</button>
          <button class="tab-btn" onclick="switchAssignFilter('past', this)">Past Due</button>
          <button class="tab-btn" onclick="switchAssignFilter('completed', this)">Completed</button>
        </div>

        <div id="assignments-list" style="display: flex; flex-direction: column; gap: var(--space-4);">
          <!-- Skeletons -->
          <div class="card skeleton" style="height: 120px;"></div>
          <div class="card skeleton" style="height: 120px;"></div>
          <div class="card skeleton" style="height: 120px;"></div>
        </div>
      </div>
    </main>
  </div>

  <script>
    let filter = 'upcoming';

    async function loadAssignments() {
      const list = document.getElementById('assignments-list');
      try {
        const assignments = await api.assignments.getAll();
        renderAssignments(assignments);
      } catch (err) {
        list.innerHTML = `<div class="card empty-state">
          <i data-lucide="alert-circle"></i>
          <h3>Sync Error</h3>
          <p>${err.message}</p>
        </div>`;
        initIcons();
      }
    }

    function renderAssignments(items) {
      const list = document.getElementById('assignments-list');
      
      const filtered = items.filter(a => {
        const due = new Date(a.due_date);
        const now = new Date();
        if (filter === 'upcoming') return due >= now && !a.completed;
        if (filter === 'past') return due < now && !a.completed;
        if (filter === 'completed') return a.completed;
        return true;
      });

      if (filtered.length === 0) {
        list.innerHTML = `
          <div class="card empty-state">
            <i data-lucide="clipboard-check"></i>
            <h3>No assignments here</h3>
            <p>You're all caught up! Take a break or start something new.</p>
          </div>`;
        initIcons();
        return;
      }

      list.innerHTML = filtered.map(a => renderAssignmentCardLarge(a)).join('');
      initIcons();
    }

    function renderAssignmentCardLarge(a) {
      const due = new Date(a.due_date);
      const diffDays = Math.ceil((due - new Date()) / (1000 * 60 * 60 * 24));
      let urgentClass = '';
      if (diffDays <= 3) urgentClass = 'soon';
      if (diffDays <= 0) urgentClass = 'urgent';

      return `
        <div class="card assignment-card card-clickable" onclick="openAssignmentDetail(${a.id})">
          <div class="due-badge-xl ${urgentClass}">
            <span class="day">${due.getDate()}</span>
            <span class="month">${due.toLocaleString('default', { month: 'short' })}</span>
          </div>
          <div class="assign-main">
            <div class="flex-between">
              <div class="assign-comm">${esc(a.community_name || 'Personal Task')}</div>
              <span class="status-pill ${a.completed ? 'status-done' : 'status-pending'}">${a.completed ? 'Completed' : 'Pending'}</span>
            </div>
            <h2 class="assign-title">${esc(a.title)}</h2>
            <p class="assign-desc">${esc(a.description || 'No additional details provided.')}</p>
          </div>
          <div class="assign-actions" style="display:flex; flex-direction:column; justify-content:center; gap:var(--space-2);">
            ${!a.completed ? 
              `<button class="btn btn-secondary btn-sm" onclick="event.stopPropagation(); handleMarkDone(${a.id})"><i data-lucide="check"></i></button>` :
              ''
            }
          </div>
        </div>
      `;
    }

    function switchAssignFilter(val, btn) {
      filter = val;
      document.querySelectorAll('.tab-btn').forEach(b => b.classList.remove('active'));
      btn.classList.add('active');
      loadAssignments();
    }

    document.addEventListener('DOMContentLoaded', async () => {
      const user = JSON.parse(localStorage.getItem('currentUser'));
      document.getElementById('nav-mount').outerHTML = renderNav('assignments', user);
      initIcons();
      loadAssignments();
    });
  </script>
</body>
</html>
